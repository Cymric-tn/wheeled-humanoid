; Arduino Mega 2560 firmware of the wheeled humanoid.
;   pio run                 build
;   pio run -t upload       flash over USB
;   pio device monitor      serial console at 115200 baud (type HELP)
; Host unit tests and the simulator library do not use PlatformIO:  make test  /  make lib

[env:megaatmega2560]
platform = atmelavr@5.3.0
board = megaatmega2560
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
build_flags = -Wall
lib_deps =
    pololu/VL53L0X@^1.3.1
    adafruit/Adafruit PWM Servo Driver Library@^3.0.2
